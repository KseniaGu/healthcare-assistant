[tool.poetry]
name = "healthcare-assistant"
version = "0.1.0"
description = "A personal healthcare mini-assistant to help you keep track of the blood test results."
readme = "README.md"
authors = ["Fuku Ro <keguryanova@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pyyaml = "^6.0.3"
jinja2 = "^3.1.6"
llama-parse = "^0.6.83"
python-dotenv = "^1.2.1"
google-genai = "^1.52.0"
numpy = "==1.26.4"
gliner = "^0.2.24"
pymupdf = "^1.26.6"
pydantic-settings = "^2.12.0"
psycopg = "^3.3.2"
psycopg-binary = "^3.3.2"
alembic = "^1.17.2"
langfuse = "^3.10.5"
streamlit = {extras = ["pdf"], version = "^1.52.1"}
plotly = "^6.5.0"
langdetect = "^1.0.9"
ftfy = "^6.3.1"
jsonschema = "^4.25.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-mock = "^3.15.1"
ruff = "^0.16.8"
mypy = "==1.16.1"

[tool.poetry.group.research]
optional = true

[tool.poetry.group.research.dependencies]
torch = "==2.14.0"
transformers = "==5.16.1"
tokenizers = "==0.23.2"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -v"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
files = ["research/extraction/datasets", "research/extraction/training", "research/extraction/evaluation"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
unfixable = ["F401"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
