[tool.poetry]
name = "healthcare-assistant"
version = "0.1.0"
description = "A personal healthcare mini-assistant to help you keep track of the blood test results."
readme = "README.md"
authors = ["Fuku Ro <keguryanova@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pyyaml = "^6.0.3"
jinja2 = "^3.1.6"
llama-parse = "^0.6.83"
python-dotenv = "^1.2.1"
google-genai = "^1.52.0"
pdfminer-six = "^20251107"
pikepdf = "^10.0.2"
numpy = "==1.26.4"
gliner = "^0.2.24"
pymupdf = "^1.26.6"
pydantic-settings = "^2.12.0"
psycopg = "^3.3.2"
psycopg-binary = "^3.3.2"
alembic = "^1.17.2"
langfuse = "^3.10.5"
streamlit = {extras = ["pdf"], version = "^1.52.1"}
plotly = "^6.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
